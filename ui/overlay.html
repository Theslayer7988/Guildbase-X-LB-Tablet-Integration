<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guildbase Apply</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Lexend', 'Segoe UI', sans-serif; }
    #wrap {
        display: none; position: fixed; inset: 5vh 8vw; flex-direction: column;
        background: #171717; border: 1px solid #404040; border-radius: 16px; overflow: hidden;
        box-shadow: 0 30px 90px rgba(0, 0, 0, .65), 0 0 30px rgba(168, 85, 247, .12);
    }
    #wrap.open { display: flex; }
    .bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #404040; color: #fff; background: #141414; }
    .bar img { height: 22px; }
    .title { flex: 1; font-weight: 500; font-size: 15px; }
    .exp { font-size: 12px; color: #737373; }
    button { font: inherit; cursor: pointer; padding: 7px 13px; border-radius: 8px; border: 1px solid #525252; background: transparent; color: #d4d4d4; font-size: 13px; font-weight: 500; }
    button:hover { background: #262626; }
    button.close { border-color: rgba(239, 68, 68, .3); background: rgba(239, 68, 68, .1); color: #f87171; }
    .stage { position: relative; flex: 1; background: #0d0d0d; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0d0d0d; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #a3a3a3; font-size: 14px; text-align: center; pointer-events: none; }
    .spin { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid #404040; border-top-color: #a855f7; border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .hint { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px; font-size: 12px; color: #737373; background: rgba(0,0,0,.4); display: none; }
</style>
</head>
<body>
<div id="wrap">
    <div class="bar">
        <img src="https://guildbase.gg/assets/img/guildbase_logo_text_colour_w.png" onerror="this.remove()">
        <div class="title" id="title"></div>
        <div class="exp" id="exp"></div>
        <button id="browser">Open in browser</button>
        <button id="reload">Reload</button>
        <button class="close" id="close">Close (Esc)</button>
    </div>
    <div class="stage">
        <div class="loading" id="loading"><div><div class="spin"></div>Loading application…</div></div>
        <iframe id="frame" allow="clipboard-read; clipboard-write"></iframe>
        <div class="hint" id="hint"></div>
    </div>
</div>
<script src="embed.js"></script>
<script>
(() => {
    const RES = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'gb-tablet';
    const post = (n, d = {}) => fetch(`https://${RES}/${n}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }).catch(() => {});
    const wrap = document.getElementById('wrap'), frame = document.getElementById('frame');
    const loading = document.getElementById('loading'), hint = document.getElementById('hint');
    let url = '', slow;
    const embed = GBEmbed(frame, {
        onLoading: () => { loading.style.display = 'grid'; },
        onLoaded: () => { loading.style.display = 'none'; hint.style.display = 'none'; clearTimeout(slow); },
        onError: () => { loading.style.display = 'none'; hint.textContent = 'Could not load the form. Press Reload, or Open in browser.'; hint.style.display = 'block'; },
        onClose: (submitted) => close(submitted),
    });

    function open(d) {
        url = d.url;
        document.getElementById('title').textContent = d.name || 'Application';
        document.getElementById('exp').textContent = d.expires_at ? 'Link expires ' + new Date(d.expires_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        loading.style.display = 'grid';
        hint.style.display = 'none';
        embed.load(url);
        wrap.classList.add('open');
        post('overlayShown');
        clearTimeout(slow);
        slow = setTimeout(() => {
            hint.textContent = 'Taking a while… press Reload, or Open in browser.';
            hint.style.display = 'block';
        }, 10000);
    }
    function openInBrowser(u) {
        try { window.invokeNative('openUrl', u); return true; } catch (e) { return false; }
    }
    function close(submitted) {
        clearTimeout(slow);
        wrap.classList.remove('open');
        embed.clear();
        post('overlayClosed', { submitted: !!submitted });
    }

    document.getElementById('reload').onclick = () => embed.reload();
    document.getElementById('close').onclick = () => close(false);
    document.getElementById('browser').onclick = () => { if (openInBrowser(url)) close(false); };
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && wrap.classList.contains('open')) close(false); });

    window.addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.action === 'gb:openApply') return open(d);
        if (d && d.action === 'gb:openUrl') { post('urlOpened', { ok: openInBrowser(d.url) }); return; }
        if (d && d.action === 'gb:closeApply') { clearTimeout(slow); wrap.classList.remove('open'); embed.clear(); return; }
    });
})();
</script>
</body>
</html>
